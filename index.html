<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Гео-AR Приложение</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        #info {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 12px;
            font-family: sans-serif;
            font-size: 14px;
            border-radius: 8px;
            z-index: 9999;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">
    <div id="info">Определяем GPS... Покрутите телефоном вокруг себя.</div>

    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-camera gps-camera="gpsMinDistance: 5;" rotation-reader></a-camera>

        <a-box 
            id="target-box"
            material="color: red;" 
            gps-entity-place="latitude: 51.135758; longitude: 71.431123;" 
            scale="12 12 12"
            position="0 2 0">
        </a-box>
    </a-scene>

    <script>
        window.addEventListener('gps-entity-place-update-positon', (event) => {
            const dist = Math.round(event.detail.distance);
            document.getElementById('info').innerText = 
                `GPS пойман! До красного куба: ${dist} м. Покрутитесь на 360° (на восток).`;
        });
    </script>
</body>
</html>
