<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Гео-AR Приложение</title>
    <!-- Подключаем A-Frame и AR.js (актуальная версия 3.4+) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <!-- Создаем AR-сцену -->
    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Камера, отслеживающая GPS и поворот телефона -->
        <a-camera gps-camera rotation-reader></a-camera>

        <!-- ВАРИАНТ А: Простой красный куб (для быстрого теста) -->
        <!-- Замените latitude и longitude на свои координаты! -->
        <a-box 
            material="color: red;" 
            gps-entity-place="latitude: 51.135620; longitude: 71.429890;"
            scale="5 5 5">
        </a-box>

        <!-- ВАРИАНТ Б: Ваша 3D-модель (раскомментируйте, когда добавите файл) -->
        <!--
        <a-entity 
            gltf-model="./assets/model.glb" 
            rotation="0 180 0" 
            scale="0.5 0.5 0.5" 
            gps-entity-place="latitude: 51.169392; longitude: 71.449074;">
        </a-entity>
        -->

    </a-scene>
</body>
</html>
